{% extends "base.html" %}

{% block title %}可视化分析{% endblock %}

{% block content %}
    <div class="container">
        <h1>可视化分析</h1>

        <!-- 新增关键词输入框 -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="input-group">
                    <input type="text" id="keywordInput" class="form-control" placeholder="请输入关键词（地区、年份、职位、学历）">
                    <div class="input-group-append">
                        <button class="btn btn-primary" onclick="filterData()">搜索</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 图表容器 -->
        <div id="charts-container">
            <!-- 1. 各专业平均分数线 -->
            <div class="card mb-4">
                <div class="card-header">各专业平均分数线</div>
                <div class="card-body">
                    <div id="chart1" class="chart-container" style="width: 100%; height: 400px;"></div>
                </div>
            </div>

            <!-- 其他图表容器 -->
            <div class="card mb-4 lazy-load">
                <div class="card-header">各专业报考人数</div>
                <div class="card-body">
                    <div id="chart2" class="chart-container" style="width: 100%; height: 400px;"></div>
                </div>
            </div>

            <div class="card mb-4 lazy-load">
                <div class="card-header">各专业招考人数</div>
                <div class="card-body">
                    <div id="chart3" class="chart-container" style="width: 100%; height: 400px;"></div>
                </div>
            </div>

            <div class="card mb-4 lazy-load">
                <div class="card-header">词云图</div>
                <div class="card-body">
                    <div id="chart4" class="chart-container" style="width: 100%; height: 400px;"></div>
                </div>
            </div>

            <div class="card mb-4 lazy-load">
                <div class="card-header">各地区平均分数线</div>
                <div class="card-body">
                    <div id="chart6" class="chart-container" style="width: 100%; height: 400px;"></div>
                </div>
            </div>

            <div class="card mb-4 lazy-load">
                <div class="card-header">各学历平均分数线</div>
                <div class="card-body">
                    <div id="chart7" class="chart-container" style="width: 100%; height: 400px;"></div>
                </div>
            </div>

            <div class="card mb-4 lazy-load">
                <div class="card-header">各职位平均分数线</div>
                <div class="card-body">
                    <div id="chart8" class="chart-container" style="width: 100%; height: 400px;"></div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block script %}
    <script src="/static/echarts.min.js" defer></script>
    <script src="/static/echarts-wordcloud.js" defer></script>

    <script>
        // 数据预加载
        const chartData = {
            fuzhuang_xiaoshou: {{ fuzhuang_xiaoshou | tojson | safe }},
            type2_name: {{ type2_name | tojson | safe }},
            type2_count: {{ type2_count | tojson | safe }},
            num_name: {{ num_name | tojson | safe }},
            num_count: {{ num_count | tojson | safe }},
            title_count1: {{ title_count1 | tojson | safe }},
            region_avg_score_count: {{ region_avg_score_count | tojson | safe }},
            region_avg_score_list: {{ region_avg_score_list | tojson | safe }},
            education_avg_score_list: {{ education_avg_score_list | tojson | safe }},
            education_avg_score_count: {{ education_avg_score_count | tojson | safe }},
            position_avg_score_list: {{ position_avg_score_list | tojson | safe }},
            position_avg_score_count: {{ position_avg_score_count | tojson | safe }}
        };

        // 延迟加载和初始化图表
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化第一个图表
            initChart1();
            
            // 使用Intersection Observer实现延迟加载
            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const chartId = entry.target.querySelector('.chart-container').id;
                        initChart(chartId);
                        observer.unobserve(entry.target);
                    }
                });
            }, {
                rootMargin: '50px 0px',
                threshold: 0.1
            });

            // 观察所有延迟加载的图表
            document.querySelectorAll('.lazy-load').forEach(chart => {
                observer.observe(chart);
            });
        });

        // 搜索功能
        function filterData() {
            var keyword = document.getElementById('keywordInput').value;
            window.location.href = '/visualization?keyword=' + encodeURIComponent(keyword);
        }

        // 图表初始化函数
        function initChart1() {
            const chart1 = echarts.init(document.getElementById('chart1'));
            chart1.setOption({
                title: { text: '各专业平均分数线' },
                tooltip: {},
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '15%',
                    containLabel: true
                },
                xAxis: { 
                    data: chartData.fuzhuang_xiaoshou.map(item => item.name),
                    axisLabel: {
                        interval: 0,
                        rotate: 45,
                        formatter: function(value) {
                            if (value.length > 8) {
                                return value.substring(0, 8) + '...';
                            }
                            return value;
                        }
                    }
                },
                yAxis: {},
                series: [{
                    name: '平均分数线',
                    type: 'bar',
                    data: chartData.fuzhuang_xiaoshou.map(item => item.value)
                }]
            });
        }

        function initChart(chartId) {
            switch(chartId) {
                case 'chart2':
                    initChart2();
                    break;
                case 'chart3':
                    initChart3();
                    break;
                case 'chart4':
                    initChart4();
                    break;
                case 'chart6':
                    initChart6();
                    break;
                case 'chart7':
                    initChart7();
                    break;
                case 'chart8':
                    initChart8();
                    break;
            }
        }

        // 2. 各专业报考人数 - 折线图
        function initChart2() {
            const chart2 = echarts.init(document.getElementById('chart2'));
            chart2.setOption({
                title: { text: '各专业报考人数' },
                tooltip: {},
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '15%',
                    containLabel: true
                },
                xAxis: { 
                    data: chartData.type2_name,
                    axisLabel: {
                        interval: 0,
                        rotate: 45,
                        formatter: function(value) {
                            if (value.length > 8) {
                                return value.substring(0, 8) + '...';
                            }
                            return value;
                        }
                    }
                },
                yAxis: {},
                series: [{
                    name: '报考人数',
                    type: 'line',
                    data: chartData.type2_count
                }]
            });
        }

        // 3. 各专业招考人数 - 饼图
        function initChart3() {
            const chart3 = echarts.init(document.getElementById('chart3'));
            const pieData3 = chartData.num_name.map((name, index) => ({ name: name, value: chartData.num_count[index] }));
            chart3.setOption({
                title: { text: '各专业招考人数' },
                tooltip: {},
                series: [{
                    name: '招考人数',
                    type: 'pie',
                    data: pieData3
                }]
            });
        }

        // 4. 词云图
        function initChart4() {
            const chart4 = echarts.init(document.getElementById('chart4'));
            chart4.setOption({
                title: { text: '词云图' },
                tooltip: {},
                series: [{
                    type: 'wordCloud',
                    data: chartData.title_count1
                }]
            });
        }

        // 6. 各地区平均分数线 - 雷达图
        function initChart6() {
            const chart6 = echarts.init(document.getElementById('chart6'));
            const radarIndicator6 = chartData.region_avg_score_list.map(name => ({
                name: name,
                max: 100
            }));
            const series6 = [
                {
                    name: '',
                    type: 'radar',
                    tooltip: {
                        trigger: 'item'
                    },
                    data: [{
                        value: chartData.region_avg_score_count,
                        name: '',
                        areaStyle: {
                            opacity: 0.2
                        }
                    }]
                }
            ];
            
            for (let i = 0; i < chartData.region_avg_score_list.length; i++) {
                const singleRegionData = Array(chartData.region_avg_score_list.length).fill(0);
                singleRegionData[i] = chartData.region_avg_score_count[i];
                
                series6.push({
                    name: chartData.region_avg_score_list[i],
                    type: 'radar',
                    symbol: 'circle',
                    symbolSize: 8,
                    itemStyle: {
                        color: '#f00'
                    },
                    lineStyle: {
                        width: 0
                    },
                    emphasis: {
                        areaStyle: {
                            color: 'rgba(255,0,0,0.3)'
                        }
                    },
                    data: [{
                        value: singleRegionData,
                        name: chartData.region_avg_score_list[i] + ': ' + chartData.region_avg_score_count[i]
                    }]
                });
            }
            
            chart6.setOption({
                title: { text: '各地区平均分数线' },
                tooltip: {
                    trigger: 'item',
                    formatter: function(params) {
                        if (params.seriesIndex === 0) {
                            var coord = params.coord || [];
                            if (coord.length > 0) {
                                var maxVal = -1;
                                var maxIndex = -1;
                                for (var i = 0; i < coord.length; i++) {
                                    if (coord[i] > maxVal) {
                                        maxVal = coord[i];
                                        maxIndex = i;
                                    }
                                }
                                
                                if (maxIndex >= 0 && maxIndex < chartData.region_avg_score_list.length) {
                                    return chartData.region_avg_score_list[maxIndex] + ': ' + chartData.region_avg_score_count[maxIndex];
                                }
                            }
                            return '';
                        } else {
                            var idx = params.seriesIndex - 1;
                            if (idx >= 0 && idx < chartData.region_avg_score_list.length) {
                                return chartData.region_avg_score_list[idx] + ': ' + chartData.region_avg_score_count[idx];
                            }
                            return '';
                        }
                    }
                },
                legend: {
                    show: false
                },
                radar: {
                    indicator: radarIndicator6
                },
                series: series6
            });
            
            chart6.on('mousemove', function(params) {
                var coord = params.event;
                var result = chart6.convertFromPixel({seriesIndex: 0}, [coord.offsetX, coord.offsetY]);
                
                var cx = chart6.getWidth() / 2;
                var cy = chart6.getHeight() / 2;
                var angle = Math.atan2(coord.offsetY - cy, coord.offsetX - cx);
                angle = (angle * 180 / Math.PI + 360) % 360;
                
                var count = radarIndicator6.length;
                var index = Math.floor((angle / 360) * count);
                
                for (var i = 0; i < chartData.region_avg_score_list.length; i++) {
                    chart6.dispatchAction({
                        type: i === index ? 'highlight' : 'downplay',
                        seriesIndex: 0,
                        dataIndex: 0
                    });
                }
                
                if (index >= 0 && index < chartData.region_avg_score_list.length) {
                    chart6.dispatchAction({
                        type: 'showTip',
                        seriesIndex: 0,
                        dataIndex: 0,
                        position: [coord.offsetX + 10, coord.offsetY + 10],
                        formatter: chartData.region_avg_score_list[index] + ': ' + chartData.region_avg_score_count[index]
                    });
                }
            });
        }

        // 7. 各学历平均分数线 - 柱状图
        function initChart7() {
            const chart7 = echarts.init(document.getElementById('chart7'));
            chart7.setOption({
                title: { text: '各学历平均分数线' },
                tooltip: {},
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '15%',
                    containLabel: true
                },
                xAxis: { 
                    data: chartData.education_avg_score_list,
                    axisLabel: {
                        interval: 0,
                        rotate: 30,
                        formatter: function(value) {
                            if (value.length > 8) {
                                return value.substring(0, 8) + '...';
                            }
                            return value;
                        }
                    }
                },
                yAxis: {},
                series: [{
                    name: '平均分数线',
                    type: 'bar',
                    data: chartData.education_avg_score_count
                }]
            });
        }

        // 8. 各职位平均分数线 - 折线图
        function initChart8() {
            const chart8 = echarts.init(document.getElementById('chart8'));
            
            var positionNames = chartData.position_avg_score_list;
            var positionScores = chartData.position_avg_score_count;
            
            if (positionNames.length > 10) {
                if (positionNames.length >= 11) {
                    positionNames = positionNames.slice(0, 9).concat([positionNames[10]]);
                    positionScores = positionScores.slice(0, 9).concat([positionScores[10]]);
                } else {
                    positionNames = positionNames.slice(0, 10);
                    positionScores = positionScores.slice(0, 10);
                }
            }
            
            var lastValidIndex = positionScores.length - 1;
            while (lastValidIndex > 0 && positionScores[lastValidIndex] < positionScores[lastValidIndex - 1]) {
                positionScores[lastValidIndex] = positionScores[lastValidIndex - 1];
            }
            
            chart8.setOption({
                title: { text: '各职位平均分数线' },
                tooltip: {},
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '15%',
                    containLabel: true
                },
                xAxis: { 
                    data: positionNames,
                    axisLabel: {
                        interval: 0,
                        rotate: 45,
                        formatter: function(value) {
                            if (value.length > 8) {
                                return value.substring(0, 8) + '...';
                            }
                            return value;
                        }
                    }
                },
                yAxis: {
                    min: function(value) {
                        return value.min * 0.8;
                    }
                },
                series: [{
                    name: '平均分数线',
                    type: 'line',
                    data: positionScores,
                    smooth: true
                }]
            });
        }

        // 优化窗口调整时的性能
        let resizeTimeout;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(function() {
                document.querySelectorAll('.chart-container').forEach(container => {
                    const chart = echarts.getInstanceByDom(container);
                    if (chart) {
                        chart.resize();
                    }
                });
            }, 250);
        });
    </script>
{% endblock %}
