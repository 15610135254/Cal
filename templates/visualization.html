{% extends "base.html" %}

{% block title %}可视化分析{% endblock %}

{% block content %}
    <div class="container">
        <h1>可视化分析</h1>

        <!-- 新增关键词输入框 -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="input-group">
                    <input type="text" id="keywordInput" class="form-control" placeholder="请输入关键词（地区、年份、职位、学历）">
                    <div class="input-group-append">
                        <button class="btn btn-primary" onclick="filterData()">搜索</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 1. 各专业平均分数线 - 柱状图 -->
        <div class="card mb-4">
            <div class="card-header">各专业平均分数线</div>
            <div class="card-body">
                <div id="chart1" style="width: 100%; height: 400px;"></div>
            </div>
        </div>

        <!-- 2. 各专业报考人数 - 折线图 -->
        <div class="card mb-4">
            <div class="card-header">各专业报考人数</div>
            <div class="card-body">
                <div id="chart2" style="width: 100%; height: 400px;"></div>
            </div>
        </div>

        <!-- 3. 各专业招考人数 - 饼图 -->
        <div class="card mb-4">
            <div class="card-header">各专业招考人数</div>
            <div class="card-body">
                <div id="chart3" style="width: 100%; height: 400px;"></div>
            </div>
        </div>

        <!-- 4. 词云图 -->
        <div class="card mb-4">
            <div class="card-header">词云图</div>
            <div class="card-body">
                <div id="chart4" style="width: 100%; height: 400px;"></div>
            </div>
        </div>

        <!-- 6. 各地区平均分数线 - 雷达图 -->
        <div class="card mb-4">
            <div class="card-header">各地区平均分数线</div>
            <div class="card-body">
                <div id="chart6" style="width: 100%; height: 400px;"></div>
            </div>
        </div>

        <!-- 7. 各学历平均分数线 - 柱状图 -->
        <div class="card mb-4">
            <div class="card-header">各学历平均分数线</div>
            <div class="card-body">
                <div id="chart7" style="width: 100%; height: 400px;"></div>
            </div>
        </div>

        <!-- 8. 各职位平均分数线 - 折线图 -->
        <div class="card mb-4">
            <div class="card-header">各职位平均分数线</div>
            <div class="card-body">
                <div id="chart8" style="width: 100%; height: 400px;"></div>
            </div>
        </div>
    </div>
{% endblock %}

{% block script %}
    <script src="/static/echarts.min.js"></script>
    <script src="/static/echarts-wordcloud.js"></script>

    <script>
        // 搜索功能
        function filterData() {
            var keyword = $('#keywordInput').val();
            window.location.href = '/visualization?keyword=' + encodeURIComponent(keyword);
        }

        // 1. 各专业平均分数线 - 柱状图
        var chart1 = echarts.init(document.getElementById('chart1'));
        chart1.setOption({
            title: { text: '各专业平均分数线' },
            tooltip: {},
            xAxis: { data: {{ fuzhuang_xiaoshou | map(attribute='name') | list | tojson }} },
            yAxis: {},
            series: [{
                name: '平均分数线',
                type: 'bar',
                data: {{ fuzhuang_xiaoshou | map(attribute='value') | list | tojson }}
            }]
        });

        // 2. 各专业报考人数 - 折线图
        var chart2 = echarts.init(document.getElementById('chart2'));
        chart2.setOption({
            title: { text: '各专业报考人数' },
            tooltip: {},
            xAxis: { data: {{ type2_name | tojson }} },
            yAxis: {},
            series: [{
                name: '报考人数',
                type: 'line',
                data: {{ type2_count | tojson }}
            }]
        });

        // 3. 各专业招考人数 - 饼图
        var chart3 = echarts.init(document.getElementById('chart3'));
        var pieData3 = [];
        {% for i in range(num_name|length) %}
            pieData3.push({ name: "{{ num_name[i] }}", value: {{ num_count[i] }} });
        {% endfor %}
        chart3.setOption({
            title: { text: '各专业招考人数' },
            tooltip: {},
            series: [{
                name: '招考人数',
                type: 'pie',
                data: pieData3
            }]
        });

        // 4. 词云图
        var chart4 = echarts.init(document.getElementById('chart4'));
        chart4.setOption({
            title: { text: '词云图' },
            tooltip: {},
            series: [{
                type: 'wordCloud',
                data: {{ title_count1 | tojson }}
            }]
        });

        // 6. 各地区平均分数线 - 雷达图
        var chart6 = echarts.init(document.getElementById('chart6'));
        var radarIndicator6 = [];
        var regionData = {{ region_avg_score_count | tojson }};
        var regionNames = {{ region_avg_score_list | tojson }};
        
        // 为每个地区创建单独的系列
        var series6 = [];
        
        // 添加总体数据系列（默认显示）
        series6.push({
            name: '',  // 移除"平均分数线"名称
            type: 'radar',
            tooltip: {
                trigger: 'item'
            },
            data: [{
                value: regionData,
                name: '',  // 移除数据项名称
                areaStyle: {
                    opacity: 0.2
                }
            }]
        });
        
        // 为每个地区创建单独的数据系列（初始不显示）
        for (var i = 0; i < regionNames.length; i++) {
            var singleRegionData = Array(regionNames.length).fill(0);
            singleRegionData[i] = regionData[i];
            
            series6.push({
                name: regionNames[i],
                type: 'radar',
                symbol: 'circle',
                symbolSize: 8,
                itemStyle: {
                    color: '#f00'
                },
                lineStyle: {
                    width: 0
                },
                emphasis: {
                    areaStyle: {
                        color: 'rgba(255,0,0,0.3)'
                    }
                },
                data: [{
                    value: singleRegionData,
                    name: regionNames[i] + ': ' + regionData[i]
                }]
            });
        }
        
        // 创建指示器
        {% for i in range(region_avg_score_list|length) %}
            radarIndicator6.push({ 
                name: "{{ region_avg_score_list[i] }}", 
                max: 100 
            });
        {% endfor %}
        
        chart6.setOption({
            title: { text: '各地区平均分数线' },
            tooltip: {
                trigger: 'item',
                formatter: function(params) {
                    if (params.seriesIndex === 0) {
                        // 对于总体数据系列，根据鼠标位置确定显示哪个区域
                        var coord = params.coord || [];
                        if (coord.length > 0) {
                            // 找出最大值对应的索引
                            var maxVal = -1;
                            var maxIndex = -1;
                            for (var i = 0; i < coord.length; i++) {
                                if (coord[i] > maxVal) {
                                    maxVal = coord[i];
                                    maxIndex = i;
                                }
                            }
                            
                            if (maxIndex >= 0 && maxIndex < regionNames.length) {
                                return regionNames[maxIndex] + ': ' + regionData[maxIndex];
                            }
                        }
                        return '';
                    } else {
                        // 对于单个地区系列，直接显示该地区的数据
                        var idx = params.seriesIndex - 1;
                        if (idx >= 0 && idx < regionNames.length) {
                            return regionNames[idx] + ': ' + regionData[idx];
                        }
                        return '';
                    }
                }
            },
            legend: {
                show: false
            },
            radar: {
                indicator: radarIndicator6
            },
            series: series6
        });
        
        // 添加鼠标移动事件，高亮当前区域
        chart6.on('mousemove', function(params) {
            var coord = params.event;
            var result = chart6.convertFromPixel({seriesIndex: 0}, [coord.offsetX, coord.offsetY]);
            
            // 计算当前指向的角度
            var cx = chart6.getWidth() / 2;
            var cy = chart6.getHeight() / 2;
            var angle = Math.atan2(coord.offsetY - cy, coord.offsetX - cx);
            angle = (angle * 180 / Math.PI + 360) % 360;
            
            // 计算当前指向的指示器索引
            var count = radarIndicator6.length;
            var index = Math.floor((angle / 360) * count);
            
            // 高亮当前区域
            for (var i = 0; i < regionNames.length; i++) {
                chart6.dispatchAction({
                    type: i === index ? 'highlight' : 'downplay',
                    seriesIndex: 0,
                    dataIndex: 0
                });
            }
            
            // 显示提示信息
            if (index >= 0 && index < regionNames.length) {
                chart6.dispatchAction({
                    type: 'showTip',
                    seriesIndex: 0,
                    dataIndex: 0,
                    position: [coord.offsetX + 10, coord.offsetY + 10],
                    // 手动设置提示框内容，只显示当前地区的数据
                    formatter: regionNames[index] + ': ' + regionData[index]
                });
            }
        });

        // 7. 各学历平均分数线 - 柱状图
        var chart7 = echarts.init(document.getElementById('chart7'));
        chart7.setOption({
            title: { text: '各学历平均分数线' },
            tooltip: {},
            xAxis: { data: {{ education_avg_score_list | tojson }} },
            yAxis: {},
            series: [{
                name: '平均分数线',
                type: 'bar',
                data: {{ education_avg_score_count | tojson }}
            }]
        });

        // 8. 各职位平均分数线 - 折线图
        var chart8 = echarts.init(document.getElementById('chart8'));
        
        // 获取原始数据
        var positionNames = {{ position_avg_score_list | tojson }};
        var positionScores = {{ position_avg_score_count | tojson }};
        
        // 只保留前10个数据点，如果数据超过10个
        if (positionNames.length > 10) {
            // 取前9个点和第11个点（如果存在）
            if (positionNames.length >= 11) {
                positionNames = positionNames.slice(0, 9).concat([positionNames[10]]);
                positionScores = positionScores.slice(0, 9).concat([positionScores[10]]);
            } else {
                positionNames = positionNames.slice(0, 10);
                positionScores = positionScores.slice(0, 10);
            }
        }
        
        // 确保折线不会下降
        var lastValidIndex = positionScores.length - 1;
        while (lastValidIndex > 0 && positionScores[lastValidIndex] < positionScores[lastValidIndex - 1]) {
            positionScores[lastValidIndex] = positionScores[lastValidIndex - 1];
        }
        
        chart8.setOption({
            title: { text: '各职位平均分数线' },
            tooltip: {},
            xAxis: { 
                data: positionNames,
                axisLabel: {
                    interval: 0,
                    rotate: 30 // 旋转标签，避免重叠
                }
            },
            yAxis: {
                min: function(value) {
                    return value.min * 0.8; // 设置y轴下限为数据最小值的80%
                }
            },
            series: [{
                name: '平均分数线',
                type: 'line',
                data: positionScores,
                smooth: true // 使线条更平滑
            }]
        });

    </script>
{% endblock %}
