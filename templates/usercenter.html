{% extends 'base.html' %}
{% block title %}用户中心{% endblock %}

{% block content %}

<div class="content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-xl-12">
                <div class="breadcrumb-holder">
                    <h1 class="main-title float-left">用户中心</h1>
                    <ol class="breadcrumb float-right">
                        <li class="breadcrumb-item"><a href="/index">主页</a></li>
                        <li class="breadcrumb-item active">用户中心</li>
                    </ol>
                    <div class="clearfix"></div>
                </div>
            </div>
        </div>
        <!-- end row -->

        <div class="row">
            <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 col-xl-12">
                <div class="card mb-3">
                    <div class="card-header">
                        <h3 class="card-title">账户信息</h3>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>用户名</label>
                                    <input type="text" class="form-control" value="{{ current_user.username }}" readonly>
                                </div>
                                <div class="form-group">
                                    <label>邮箱</label>
                                    <input type="email" class="form-control" value="{{ current_user.email }}" readonly>
                                </div>
                                <div class="form-group">
                                    <label>权限</label>
                                    <input type="text" class="form-control" value="{% for role in current_user.roles %}{{ role.description }}{% endfor %}" readonly>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <form method="post" action="/update_password">
                                    <div class="form-group">
                                        <label>旧密码</label>
                                        <input type="password" class="form-control" name="old_password" required>
                                    </div>
                                    <div class="form-group">
                                        <label>新密码</label>
                                        <input type="password" class="form-control" name="new_password" required>
                                    </div>
                                    <div class="form-group">
                                        <label>确认新密码</label>
                                        <input type="password" class="form-control" name="confirm_password" required>
                                    </div>
                                    <button type="submit" class="btn btn-primary">修改密码</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- END container-fluid -->
</div>

<!-- 添加弹窗提示脚本 -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        {% if success %}
            // 显示成功提示
            alert("{{ success }}");
        {% endif %}
        
        {% if error %}
            // 显示错误提示
            alert("{{ error }}");
        {% endif %}
    });
</script>

{% endblock %}
